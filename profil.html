<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mon profil</title>
</head>

<body style="background-color: #ffc5d3; font-family: Arial, sans-serif;">

    <from action="/verif" method="post">
    <h1>Mon Profil ˚ʚ♡ɞ˚</h1>
    <p>page profil !</p>
    <label for="nom">Nom d'utilisateur</label>
    <input type="text" id="nom" name="nom">
    <div>
        <br>
    <label for="email">Adresse email</label>
    <input type="email" id="email" name="email">
    <div>
        <br>
    <label for="motdepasse">Mot de passe</label>(max 12 caractères)
    <input type="password" id="motdepasse" name="motdepasse" maxlength="12">
      <span id="togglePassword">👁️</span>
      <script>
  const togglePassword = document.querySelector('#togglePassword');
  const password = document.querySelector('#motdepasse');

  togglePassword.addEventListener('click', function () {
    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
    password.setAttribute('type', type);
    this.textContent = type === 'password' ? '👁️' : '🔒';
  });
</script>
    <br>
    <br>
    <br>
    <br>
    <label for = madame>Madame</label>
    <input type="radio" id="madame" name="genre" value="madame">
    <label for = monsieur>Monsieur</label>
    <input type="radio" id="monsieur" name="genre" value="monsieur">
    <label for = autre>Autre</label>
    <input type="radio" id="autre" name="genre" value="autre">
    <div>
        <br>
    <label for =reset>Reset</label>
    <input type="reset" value="Reset">
    <input type="submit" value="Enregistrer">
    <div>
        <br>
    <button type="button" onclick="window.location.href='index.html'">Retour</button>
</from>  
</body>
</html>
